[versions]
# Versions are aligned with the radioplayer-automotive-radio project so the copied
# `core/designsystem` sources compile against the exact same Compose/Material3 APIs.
androidGradlePlugin = "9.2.1"
androidxActivity = "1.13.0"
androidxAppCompat = "1.8.0"
androidxComposeBom = "2026.04.01"
androidxCore = "1.18.0"
# Pinned to the version `material3-window-size-class` already resolves, so declaring it directly
# (see `rememberStableWindowSizeClass`) cannot shift the graph.
androidxWindow = "1.5.0"
androidxLifecycle = "2.10.0"
androidxTestExt = "1.3.0"
androidxMedia = "1.7.0"
coil = "3.4.0"
kotlin = "2.2.21"
junit4 = "4.13.2"

# Ported 1:1 from radioplayer-automotive-appstore/gradle/libs.versions.toml so the store's
# networking stack (Retrofit + Gson + OkHttp logging) matches the reference implementation.
retrofit = "2.11.0"
converterGson = "2.11.0"
loggingInterceptor = "4.12.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppCompat" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
winsize = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "androidxWindow" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
# MediaBrowserCompat: android.media.MediaBrowser is a hidden API from API 34, so binding to a
# headless media app's MediaBrowserService requires this.
androidx-media = { group = "androidx.media", name = "media", version.ref = "androidxMedia" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "converterGson" }
junit = { group = "junit", name = "junit", version.ref = "junit4" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "loggingInterceptor" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
